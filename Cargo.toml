[package]
name = "shopping"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
memchr = "2"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
parquet = { version = "53", default-features = false }
mimalloc = { version = "0.1", default-features = false }
bytes = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
